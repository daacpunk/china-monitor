# One-command setup for the AKShare sidecar on a VPS (Hong Kong / mainland CN).
#
#   1. cp .env.example .env   &&   edit .env to set AKSHARE_TOKEN
#   2. docker compose up -d --build
#
# Then point the main app's AKSHARE_SIDECAR_URL at this host (see
# HOSTING_CHINA_REGION.md). Container auto-restarts on reboot/crash.

services:
  akshare-sidecar:
    build: .
    image: akshare-sidecar
    container_name: akshare-sidecar
    restart: unless-stopped
    # Cap memory so an OOM kills ONLY this container (Docker then restarts it
    # cleanly) instead of wedging the whole 1GB VPS. Tune via .env if needed.
    mem_limit: "${SIDECAR_MEM_LIMIT:-700m}"
    mem_reservation: "${SIDECAR_MEM_RESERVATION:-256m}"
    labels:
      # Autoheal force-restarts this container whenever its healthcheck reports
      # UNHEALTHY. `restart: unless-stopped` alone only reacts to process EXIT,
      # not to a hung-but-alive process (the failure seen 2026-07: port bound,
      # HTTP hung, no auto-recovery). This closes that gap.
      autoheal: "true"
    ports:
      # host:container — change the host port if 8000 is taken.
      - "${HOST_PORT:-8000}:8000"
    environment:
      # Shared secret the main app sends as X-AKShare-Token. REQUIRED.
      AKSHARE_TOKEN: "${AKSHARE_TOKEN:?set AKSHARE_TOKEN in .env}"
      # Port the app binds inside the container (keep 8000 to match the image).
      PORT: "8000"
      # Bind host. On a VPS keep 0.0.0.0 (IPv4) so Docker's port mapping works.
      # (Railway sets BIND_HOST=:: for its IPv6-only internal network instead.)
      BIND_HOST: "${BIND_HOST:-0.0.0.0}"
      # Optional cache tuning (defaults: 24h TTL, 500 entries).
      AKSHARE_CACHE_TTL: "${AKSHARE_CACHE_TTL:-86400}"
      AKSHARE_CACHE_MAX: "${AKSHARE_CACHE_MAX:-500}"
    healthcheck:
      # /health needs no auth — confirms the app is up.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Watches all containers labeled autoheal=true and restarts any that go
  # UNHEALTHY. Tiny (~10MB). Needs the Docker socket read-only to poll status.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: akshare-autoheal
    restart: unless-stopped
    mem_limit: "64m"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"      # check every 15s
      AUTOHEAL_START_PERIOD: "30"  # grace before first check
      CURL_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
