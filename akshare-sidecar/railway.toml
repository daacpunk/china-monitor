# Railway service config for akshare-sidecar.
# Deploy as a second service in the existing china-monitor project,
# pointing this service's root at /akshare-sidecar.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No healthcheck — Railway's healthcheck probes the PUBLIC domain, and we
# only expose this service over the internal/private network. A healthcheck
# here would mark every deploy as failed.
# /health is still available internally; the main service uses it via
# /api/akshare/health to monitor the sidecar.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
